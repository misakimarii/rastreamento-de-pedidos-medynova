<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="assets/icons/favicon.png" type="image/png">
</head>

<body>
    
  <header>
    <img src="assets/logo/logo.png" alt="Logo da empresa.">
  </header>

  <h1 class="situacao-pedido">Situação do seu pedido</h1>

  <main class="container">
    <div class="card">
        <h2>Seu pedido está a caminho</h2>
        <p id="previsao" style="font-weight: bold;"></p>

        <div class="status-timeline etapa-2">

          <div class="status-step inativo">
              <img src="assets/icons/icons8-box-100.png" alt="Pedido coletado">
              <p class="status-titulo">Pedido coletado</p>
              <p class="status-data">00/00/2020 <br> 00:00</p>
          </div>
          
          

          <div class="status-step inativo">
            <img src="assets/icons/caminhão.png" alt="Em transporte">
            <p class="status-titulo">Em transporte</p>
            <p class="status-data">00/00/2020 <br> 00:00</p>
          </div>

          

          <div class="status-step inativo">
            <img src="assets/icons/carrinho-de-mão.png" alt="Saiu para entrega">
            <p class="status-titulo">Saiu para entrega</p>
            <p class="status-data">00/00/2020 <br> 00:00</p>
          </div>



          <div class="status-step inativo">
            <img src="assets/icons/concluído.png" alt="Entrega concluída">
            <p class="status-titulo">Entrega concluída</p>
            <p class="status-data">00/00/2020 <br> 00:00</p>
          </div>
          
        </div>
    </div>

    <a href="index.html" class="btn-voltar">Consultar outro</a>

  </main>

  <footer> <p>&copy; 2026 - Medynova Medicamentos Especiais </p></footer>
  <script src="js/resultado.js"></script>

</body>
</html>

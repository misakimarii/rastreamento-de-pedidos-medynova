<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="assets/icons/favicon.png" type="image/png">
</head>

<body>
    
  <header>
    <img src="assets/logo/logo.png" alt="Logo da empresa.">
  </header>

  <main class="container-1">
    <h1>Acompanhe seu pedido</h1>
    <p>Digite o número da <strong>nota fiscal</strong> para acompanhar a entrega</p>
  
      <form  class="form-consulta" id="form-consulta">
        <label for="nf">Número da Nota Fiscal:</label>

        <input type="text" id="nf" name="nf" placeholder="Ex: 123" required >

        <button type="submit">Consultar</button>
      </form>

  </main>
  <footer> <p>&copy; 2026 - Medynova Medicamentos Especiais </p></footer>

  <script src="js/app.js"></script>

</body>
</html>
